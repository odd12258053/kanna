[package]
name = "hasami"
description = "A layered command line argument parser: a tiny GNU/POSIX-correct core with an optional declarative builder, macro DSL, help, suggestions and derive."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"

[features]
default = ["help", "std"]
# Reserved: forwards to the core. See ADR-0002.
std = ["hasami-core/std"]
# `-h/--help`, `-V/--version` and help text rendering.
help = []
# "did you mean" suggestions for unknown options, subcommands and values.
suggest = []
# ANSI colour in help and error output (honours NO_COLOR, CLICOLOR, CLICOLOR_FORCE and TTY detection).
color = []
# Environment variable fallback for option values.
env = []
# `Error::to_json` and `HASAMI_ERROR_FORMAT=json` for machine-readable errors.
json = []
# `#[derive(Args)]` (pulls in syn; isolated in hasami-derive).
derive = ["dep:hasami-derive"]
# Everything except `derive`. Shell completion, documentation and schema
# generation live in the `hasami-complete`, `hasami-doc` and `hasami-schema`
# crates, which depend on this one (see ADR-0015).
full = ["help", "suggest", "color", "env", "json"]

[dependencies]
hasami-core = { workspace = true }
hasami-derive = { workspace = true, optional = true }

[dev-dependencies]
hasami-complete = { path = "../hasami-complete", version = "0.1.0" }
hasami-doc = { path = "../hasami-doc", version = "0.1.0" }
hasami-schema = { path = "../hasami-schema", version = "0.1.0" }
trycmd = { version = "0.15", features = ["examples"] }
trybuild = "1.0"

[[example]]
name = "derive"
required-features = ["derive"]

[[example]]
name = "env"
required-features = ["env"]

[[test]]
name = "snapshots"
required-features = ["help"]

[[test]]
name = "ui"
required-features = ["derive"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
