[workspace]
resolver = "3"
members = [
    "kanna",
    "kanna-core",
    "kanna-derive",
    "kanna-complete",
    "kanna-doc",
    "kanna-schema",
    "benches",
    # Complete applications built on each layer; see examples/README.md.
    "examples/wc",
    "examples/sift",
    "examples/todo",
    "examples/hexdump",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/odd12258053/kanna"
authors = ["odd <odd@agraffe.info>"]
keywords = ["cli", "arguments", "parser", "argparse", "getopt"]
categories = ["command-line-interface"]

[workspace.dependencies]
kanna-core = { path = "kanna-core", version = "0.1.0", default-features = false }
kanna = { path = "kanna", version = "0.1.0", default-features = false }
kanna-derive = { path = "kanna-derive", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

# Profile used by the size gate (see benches/size). Mirrors what a size-conscious
# CLI author would ship with.
[profile.size]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
