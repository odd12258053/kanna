[package]
name = "kanna-prompt"
description = "A read-eval-print loop for kanna commands: one line in, the same definition parses it, your handler runs it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# `complete_line`: completion candidates for a partly typed line, for
# use with a line-editing library.
complete = ["dep:kanna-complete"]

[dependencies]
kanna = { workspace = true, features = ["help"] }
kanna-complete = { path = "../kanna-complete", version = "0.2.0", optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
